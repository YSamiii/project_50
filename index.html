<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#151515" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Project打卡" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Project 自定义挑战</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="mobile-header">
      <div>
        <div class="eyebrow" id="challengeLabel">PROJECT 30</div>
        <h1 id="pageTitle">今日打卡</h1>
      </div>
      <button class="round-btn" id="newChallengeBtn" aria-label="新建挑战">＋</button>
    </header>

    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">P</div><div><b>PROJECT</b><small>自定义挑战打卡</small></div></div>
      <nav>
        <button class="nav-item active" data-view="today">今日打卡</button>
        <button class="nav-item" data-view="calendar">挑战日历</button>
        <button class="nav-item" data-view="rules">挑战规则</button>
        <button class="nav-item" data-view="rewards">阶段奖励</button>
        <button class="nav-item" data-view="settings">挑战设置</button>
      </nav>
      <div class="sidebar-footer"><div class="progress-ring" id="progressRing"><span id="progressPercent">0%</span></div><div><small>当前进度</small><strong id="sideProgress">Day 1 / 30</strong></div></div>
    </aside>

    <main class="main">
      <header class="desktop-header">
        <div><div class="eyebrow" id="challengeLabelDesktop">PROJECT 30</div><h1 id="pageTitleDesktop">今日打卡</h1></div>
        <div class="top-actions"><button class="secondary" id="exportBtn">导出数据</button><button class="primary" id="newChallengeBtnDesktop">新建挑战</button></div>
      </header>

      <section class="view active" id="view-today">
        <article class="card day-card">
          <div class="day-card-head">
            <label><span>日期</span><input type="date" id="entryDate" /></label>
            <div class="day-counter"><span>Day</span><strong id="dayNumber">1</strong><em id="dayTotal">/30</em></div>
          </div>
          <div class="meta-row">
            <label>起床时间<input type="time" id="wakeTime" /></label>
            <label>睡眠时长<input type="number" id="sleepHours" min="0" max="24" step="0.5" placeholder="小时" /></label>
            <label>心情<select id="mood"><option value="">选择</option><option>很好</option><option>不错</option><option>一般</option><option>疲惫</option><option>低落</option></select></label>
          </div>
        </article>

        <article class="card summary-card">
          <div><span>今日完成</span><strong><b id="doneCount">0</b><small id="ruleCount">/0 项</small></strong></div>
          <div class="bar"><div id="todayBar"></div></div>
          <p id="completionHint">开始完成今天的规则</p>
        </article>

        <article class="card">
          <div class="section-head"><h2>挑战规则</h2><button class="text-btn" data-jump="rules">编辑</button></div>
          <div id="todayRules" class="checklist"></div>
        </article>

        <article class="card journal-card">
          <div class="section-head"><h2>每日记录</h2><span>自动保存</span></div>
          <label>今天值得感恩／开心的事<textarea id="gratitude" rows="3"></textarea></label>
          <label>今天的总结与思考<textarea id="reflection" rows="4"></textarea></label>
          <label>记录过程／进步<textarea id="progressNote" rows="5"></textarea></label>
        </article>
      </section>

      <section class="view" id="view-calendar">
        <article class="card">
          <div class="section-head stacked"><div><h2 id="calendarTitle">Project 30 打卡记录</h2><p>点击任意一天查看或补充记录</p></div><div class="legend"><span class="dot done"></span>完成 <span class="dot partial"></span>部分 <span class="dot empty"></span>未记录</div></div>
          <div id="dayGrid" class="day-grid"></div>
        </article>
      </section>

      <section class="view" id="view-rules">
        <article class="card"><div class="section-head stacked"><div><h2>自定义挑战规则</h2><p>可随时增删或修改。</p></div><div class="rule-actions"><button class="secondary full-mobile" id="restoreDefaultRulesBtn">恢复默认规则</button><button class="primary full-mobile" id="addRuleBtn">添加规则</button></div></div><div id="ruleEditor" class="rule-editor"></div></article>
      </section>

      <section class="view" id="view-rewards">
        <article class="card"><div class="section-head stacked"><div><h2>阶段奖励</h2><p>为关键节点设置奖励。</p></div><button class="primary full-mobile" id="addRewardBtn">添加奖励</button></div><div id="rewardEditor" class="reward-editor"></div></article>
      </section>

      <section class="view" id="view-settings">
        <article class="card settings-card">
          <h2>挑战设置</h2>
          <div class="form-grid">
            <label>挑战名称<input id="challengeName" type="text" /></label>
            <label>挑战天数<input id="challengeDays" type="number" min="1" max="365" /></label>
            <label>开始日期<input id="startDate" type="date" /></label>
            <label>每日完成标准<select id="completionMode"><option value="all">全部规则完成</option><option value="percent">达到指定比例</option></select></label>
            <label id="percentField" class="hidden">最低完成比例<input id="completionPercent" type="number" min="1" max="100" /></label>
          </div>
          <label>挑战宣言<textarea id="manifesto" rows="3"></textarea></label>
          <div class="settings-actions"><button class="danger" id="resetBtn">清空挑战</button><button class="primary" id="saveSettingsBtn">保存设置</button></div>
          <button class="secondary export-mobile" id="exportBtnMobile">导出数据</button>
        </article>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="active" data-view="today"><span>✓</span>今日</button>
      <button data-view="calendar"><span>▦</span>日历</button>
      <button data-view="rules"><span>☷</span>规则</button>
      <button data-view="rewards"><span>☆</span>奖励</button>
      <button data-view="settings"><span>⚙</span>设置</button>
    </nav>
  </div>

  <dialog id="challengeDialog">
    <form method="dialog" class="dialog-card" id="challengeForm">
      <div class="section-head"><h2>新建挑战</h2><button class="icon-btn" value="cancel">×</button></div>
      <label>挑战名称<input id="newName" type="text" value="Project 30" required /></label>
      <label>挑战天数<input id="newDays" type="number" min="1" max="365" value="30" required /></label>
      <label>开始日期<input id="newStart" type="date" required /></label>
      <div class="dialog-actions"><button class="secondary" value="cancel">取消</button><button class="primary" id="createChallengeBtn" value="default">创建</button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
